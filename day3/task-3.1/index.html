<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3.1</title>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <header class="header">
      <a href="/" class="header__logo">Каталог товаров</a>
    </header>

    <main class="main-content">
      <h1>Каталог товаров</h1>

      <!-- Блок состояния: загрузка / ошибка -->
      <div class="status" id="status" role="status" hidden>
        <p class="status__text" id="status-text"></p>
      </div>

      <!-- Список карточек -->
      <ul class="card-list" id="card-list" hidden></ul>

      <!-- Шаблон карточки товара -->
      <template id="product-template">
        <li class="card">
          <h3 class="card__title"></h3>
          <p class="card__text"></p>
          <p class="card__price"></p>
        </li>
      </template>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
